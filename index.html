<!doctype html><meta charset="utf-8"><title>DW boot</title>
<body style="margin:0;background:#141414;color:#eee;font:20px sans-serif">
<p style="margin:24px" id="t">Deadlock Walker: жду dw на 127.0.0.1:8765…</p>
<script>
const API = "http://127.0.0.1:8765";
function boot() {
  fetch(API + "/app").then(r => r.text()).then(html => {
    document.open(); document.write(html); document.close();
  }, () => setTimeout(boot, 2000));
}
boot();
</script>
